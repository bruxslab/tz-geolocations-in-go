name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: tz_owner
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: tz_locations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tz_owner -d tz_locations_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tz_owner:ci-test-only@127.0.0.1:5432/tz_locations_test?sslmode=disable
      REQUIRE_DATABASE_TESTS: "1"
      CGO_ENABLED: "1"
    steps:
      - name: Set contract results path
        run: printf 'CONTRACT_RESULTS_PATH=%s/tz-go-contracts.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Static analysis
        run: go vet ./...
      - name: Validate pinned data
        run: go run ./cmd/validate
      - name: Unit, PostgreSQL, and reference contract tests
        run: go test ./...
      - name: Race detection
        run: go test -race ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OpenAPI and actual response schemas
        run: |
          python -m pip install -r scripts/requirements-dev.txt
          python scripts/validate-openapi.py "$CONTRACT_RESULTS_PATH"
      - name: Build runtime image
        run: docker build -t tz-locations-api:ci .
