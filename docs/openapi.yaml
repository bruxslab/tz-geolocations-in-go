    "/v1/wards/{slug}/streets": {
      "get": {
        "operationId": "getStreets",
        "summary": "List streets in a ward; meta.total is page size",
        "parameters": [
          {
            "name": "slug",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-z0-9-]{1,100}$"
            },
            "description": "Source slug; ambiguous unqualified lookups select the lowest preserved source ID."
          },
          {
            "name": "region_slug",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^[a-z0-9-]{1,100}$"
            },
            "description": "Optional region context; empty or invalid supplied values are rejected."
          },
          {
            "name": "district_slug",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^[a-z0-9-]{1,100}$"
            },
            "description": "Optional district context; combine with region_slug to identify a ward."
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "default": "100"
            },
            "description": "JavaScript-compatible numeric value, default 100, clamped to 1..500. Zero or unparseable values use the default. Fractions produce legacy INTERNAL_ERROR."
          },
          {
            "name": "offset",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "default": "0"
            },
            "description": "Nonnegative safe integer; invalid/negative values become zero. Fractions produce legacy INTERNAL_ERROR."
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string"
