name: tz-locations

x-tool: &tool
  image: tz-locations-api:local
  build: .
  environment:
    MIGRATION_DATABASE_URL: postgres://tz_owner:${TZ_OWNER_PASSWORD:?Set TZ_OWNER_PASSWORD in .env}@postgres:5432/tz_locations?sslmode=disable
    RUNTIME_DATABASE_ROLE: tz_reader
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      TZ_OWNER_PASSWORD: ${TZ_OWNER_PASSWORD:?Set TZ_OWNER_PASSWORD in .env}
      TZ_RUNTIME_PASSWORD: ${TZ_RUNTIME_PASSWORD:?Set TZ_RUNTIME_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-tz-locations.sh:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tz_locations"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *tool
    entrypoint: ["/migrate"]
    profiles: [tools]

  import:
    <<: *tool
    entrypoint: ["/import"]
    profiles: [tools]

  test:
    image: tz-locations-test:local
    build:
      context: .
      target: build
    profiles: [tools]
    environment:
      TEST_DATABASE_URL: postgres://tz_owner:${TZ_OWNER_PASSWORD:?Set TZ_OWNER_PASSWORD in .env}@postgres:5432/tz_locations_test?sslmode=disable
      REQUIRE_DATABASE_TESTS: "1"
      CGO_ENABLED: "1"
    command: ["/bin/sh", "-c", "go test ./... && go test -race ./... && go vet ./... && test -z \"$$(gofmt -l .)\" && go run ./cmd/validate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: tz-locations-api:local
    build: .
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://tz_reader:${TZ_RUNTIME_PASSWORD:?Set TZ_RUNTIME_PASSWORD in .env}@postgres:5432/tz_locations?sslmode=disable
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      DATABASE_MIN_CONNS: ${DATABASE_MIN_CONNS:-2}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  postgres_data:
